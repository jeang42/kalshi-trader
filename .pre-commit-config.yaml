# Pre-commit hooks. To activate:
#   pip install pre-commit
#   pre-commit install
# After that, `git commit` runs ruff + mypy automatically. Skip with `--no-verify`
# only when you have a deliberate reason — CI will still enforce both.

# Files no hook may rewrite, because their bytes are the point:
#
#   */static/htmx.min.js  vendored third-party (htmx 1.9.12, BSD-2-Clause,
#                         attributed in NOTICE). It ships with no trailing
#                         newline, so `end-of-file-fixer` "fixes" all three
#                         copies and they stop matching upstream — which
#                         defeats vendoring and makes the NOTICE inaccurate.
#   research/*.json       recorded research output. Reformatting a result
#                         file is editing the research record.
#   docs/images/          binary.
#
# Without this, `pre-commit run --all-files` on a clean checkout rewrote 17
# files, four of them in these categories.
exclude: '^(baseball|tennis|wnba)/static/|^research/.*\.json$|^docs/images/'

repos:
  # Built-in housekeeping
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # Ruff — lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  # mypy — type check on the gated non-Streamlit modules.
  #
  # `pass_filenames: false` + no `args` means this runs a BARE `mypy`, which
  # takes its target list from `[tool.mypy] files` in pyproject.toml — the
  # same list `make typecheck` and the CI job use. Do not reintroduce a
  # `files:` regex here: the previous one listed pre-R-24 ROOT-level module
  # names (`^(polymarket_client|...)\.py$`), and once the modules moved under
  # pm/ it matched exactly ONE file in the tree (`live_gates.py`, the root
  # shim). The hook reported success without type-checking anything the gate
  # was meant to cover, for as long as the pm/ layout has existed.
  #
  # Checking the whole gated list on every commit rather than just the staged
  # files costs ~2s warm (mypy's incremental cache does the work) and is the
  # price of the two tools agreeing.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies:
          # No pandas-stubs: see the note in .github/workflows/ci.yml —
          # it reports ~39 pre-existing errors and must match CI.
          - types-requests
          - types-python-dateutil
