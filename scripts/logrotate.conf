# Log rotation for the polymarket-analyzer cron jobs.
#
# Runs as the user (no sudo, no /etc/logrotate.d needed) via a daily
# user-cron entry like:
#
#     0 2 * * *  /usr/sbin/logrotate --state ~/.cache/polymarket-logrotate.state \
#                /home/USER/Coding/kalshi-trader/scripts/logrotate.conf
#
# Why `copytruncate`: each cron job opens its log file via shell `>>`
# redirect on every invocation, so there's no long-lived process to
# signal-HUP after a rotation. `copytruncate` rotates by copying the
# file to its archive name and then truncating the original in place —
# any cron process that happens to be writing during the rotation
# continues writing to the now-empty file, no data lost beyond a tiny
# window.
#
# Why `delaycompress`: keeps yesterday's log uncompressed so `tail`
# and `grep` Just Work without `zcat`. Compresses files older than that.

# NOT COVERED, DELIBERATELY: the real-money order audit trail, which lives
# at data/shared/audit/orders.log — one directory down, because this glob is
# non-recursive. It used to sit in data/shared/ and this rule quietly
# copytruncated it every night and deleted every generation past 14 days;
# all order history before ~2026-07-11 is gone as a result (found 09-20).
# Do NOT "fix" that by adding an orders.log stanza here: logrotate 3.21
# treats a specific-stanza + glob overlap as a FATAL duplicate and stops
# processing the pattern — measured, it dropped 28 of 47 other logs from
# rotation and exited 1. Keeping the audit log out of this directory is the
# only version that cannot regress. tests/test_pm_layout.py enforces it.

/home/USER/Coding/kalshi-trader/data/shared/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
